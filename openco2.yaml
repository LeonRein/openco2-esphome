# ESPHome firmware for the OpenCO2 Sensor
# https://github.com/davidkreidler/OpenCO2_Sensor  (ESP32-S2 + SCD4x + 1.54" e-paper)
#
# Pin map taken from the stock Arduino firmware (v6.2):
#   DISPLAY_POWER    GPIO45      e-paper panel power rail
#   LED_POWER        GPIO9       RGB LED power rail
#   LED_PIN          GPIO39      WS2812 data (HW rev 3)
#   USB_PRESENT      GPIO4       high = power adapter, low = battery
#   BATTERY_VOLTAGE  GPIO5       ADC, 1:2 divider
#   BUTTON           GPIO0       menu button, active low
#   DISABLE_CHARGING GPIO10
#   e-paper SPI      CLK 41, MOSI 21, CS 42, DC 8, BUSY 6, RST 7
#   I2C (SCD4x)      HW rev 3: SDA 3 / SCL 2   |   HW rev 1-2: SDA 33 / SCL 34

substitutions:
  device_name: openco2
  friendly_name: OpenCO2 Sensor

  # ---- Hardware revision -------------------------------------------------
  # Recent boards (HWSubRev 3) use I2C 3/2 and a WS2812 LED on GPIO39.
  # Older boards (HWSubRev 1-2) use I2C 33/34 and an APA102 (data 40, clk 39).
  # If the i2c scan in the log finds nothing at 0x62, switch to 33/34.
  i2c_sda: GPIO3
  i2c_scl: GPIO2

  # ---- Behaviour ---------------------------------------------------------
  battery_sleep: 5min # deep-sleep cycle when running on battery
  # Poll the SCD4x fast: on battery this is how long the sensor stays awake
  # waiting for its first reading before it can sleep again.
  sensor_interval: 5s
  display_interval: 30s # e-paper refresh while on the power adapter
  # A full (flashing) e-paper refresh at most this often, in both modes.
  # Everything in between is a partial refresh. Lower it if ghosting builds
  # up; the "Display full refresh" button forces one in between.
  full_update_interval: 2h
  low_battery_volts: "3.30" # below this the sensor parks itself to protect the cell

  # ---- Temperature compensation ------------------------------------------
  # The SCD4x sits on the same small board as the ESP32-S2, the charger and
  # the LED, so it reads warm. These are subtracted from the raw reading.
  # Defaults are the stock firmware's values (getTempOffset(), v6.3):
  #   power adapter, Wi-Fi connected:  12.2 K
  #   power adapter, no Wi-Fi:          4.4 K
  #   battery:                          0.0 K  (sensor idle between readings)
  # They are only the start values: each is also a number entity
  # ("Temperature offset ...") that can be tuned from Home Assistant without
  # reflashing. A value set there is stored on the device and wins over
  # these defaults from then on.
  temp_offset_wifi: "12.2"
  temp_offset_usb: "4.4"
  temp_offset_battery: "0.0"

  # ---- Wi-Fi away from home ----------------------------------------------
  # On the adapter Wi-Fi is switched on, but if no network is found within
  # wifi_give_up the radio is switched off again (endless scanning heats the
  # board and the "no Wi-Fi" offset would be wrong). Every wifi_retry it
  # tries once more, so it reconnects on its own when you are back home.
  wifi_give_up: 2min
  wifi_retry: 30min

# Own e-paper driver (components/openco2_epaper): keeps the last image so
# partial refreshes work after the panel slept or the ESP was in deep sleep.
external_components:
  - source:
      type: local
      path: components
    components: [openco2_epaper]

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    # Bring the e-paper rail up before the display component talks to the panel.
    - priority: 800
      then:
        - switch.turn_on: epd_power
    # Decide battery vs. adapter behaviour once all pins have been read.
    - priority: -100
      then:
        - script.execute: apply_power_mode
  on_shutdown:
    # Runs before deep sleep: park the LED cleanly, then cut its rail.
    priority: 700
    then:
      # Stop the SCD4x's periodic measurement so it idles while the ESP
      # sleeps. Left running it draws ~15 mA for the whole 5 min and warms
      # itself, which the stock firmware avoids with single-shot readings
      # (its battery offset is 0.0 only because of that). ESPHome restarts
      # the measurement in its setup on the next wake.
      - lambda: id(scd).write_command((uint16_t) 0x3f86);
      - light.turn_off: led
      - delay: 50ms
      - switch.turn_off: led_power

esp32:
  board: esp32-s2-saola-1
  # ESPHome defaults the S2 to 240 MHz. The stock firmware is built at 80 MHz
  # (its README and CI both say so), and its 12.2 K adapter offset was
  # measured that way - at 240 MHz the chip heats the CO2 sensor noticeably
  # more and every reading ends up too high.
  cpu_frequency: 80MHZ
  framework:
    type: esp-idf

# Logs go over the native USB port (the S2 has no USB-serial bridge).
logger:
  level: INFO
  hardware_uart: USB_CDC

# reboot_timeout: 0s is what makes the sensor usable away from home - without it
# ESPHome reboots every 15 min when it cannot reach Wi-Fi or Home Assistant.
api:
  reboot_timeout: 0s

# Lets a web flasher (web.esphome.io) set the Wi-Fi credentials over USB after
# flashing, so a prebuilt image needs none baked in. Credentials set this way
# are stored on the device and take precedence over secrets.yaml. Only works
# while Wi-Fi is on, i.e. within wifi_give_up of plugging in the adapter.
improv_serial:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: wifi_comp
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Wi-Fi stays off until the power adapter is plugged in (see apply_power_mode).
  enable_on_boot: false
  reboot_timeout: 0s
  power_save_mode: HIGH
  fast_connect: true

deep_sleep:
  id: sleeper
  sleep_duration: ${battery_sleep}
  # Plugging in the power adapter pulls GPIO4 high and wakes the sensor at
  # once - a level interrupt on an RTC GPIO, active while the chip sleeps.
  # ext0 on USB_PRESENT, level high, is exactly what the stock firmware uses
  # (goto_deep_sleep: esp_sleep_enable_ext0_wakeup(USB_PRESENT, 1)); it keeps
  # the RTC peripheral domain powered, a few uA next to the SCD4x's idle draw.
  # KEEP_AWAKE: never go to sleep while the adapter is plugged in.
  wakeup_pin:
    number: GPIO4
    allow_other_uses: true # also read as a binary_sensor
  wakeup_pin_mode: KEEP_AWAKE

globals:
  - id: low_battery
    type: bool
    restore_value: false
    initial_value: "false"

i2c:
  id: bus_a
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true # set to false once 0x62 shows up in the log

spi:
  - id: disp_spi
    clk_pin: GPIO41
    mosi_pin: GPIO21

switch:
  - platform: gpio
    id: epd_power
    pin: GPIO45
    restore_mode: ALWAYS_ON
    internal: true

  - platform: gpio
    id: led_power
    # HW rev 3: active high. On HW rev 1-2 add `inverted: true`.
    pin: GPIO9
    restore_mode: ALWAYS_OFF
    internal: true

  # Stock firmware keeps the LED off on battery; this switch lets you override.
  - platform: template
    id: led_enabled
    name: LED
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - light.turn_off: led
      - delay: 50ms
      - switch.turn_off: led_power

  - platform: gpio
    id: disable_charging
    name: Disable charging
    pin: GPIO10
    restore_mode: ALWAYS_OFF
    entity_category: config

  # Stock default (limitMaxBattery): stop charging above 4.0 V, resume below
  # 3.9 V. Easier on the LiPo, and no charger heat next to the sensor once
  # it sits on the adapter all day. Driven from the battery voltage sensor.
  - platform: template
    id: charge_limit
    name: Limit charge to 4.0 V
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_off:
      - switch.turn_off: disable_charging

binary_sensor:
  # ---- the battery / power-adapter distinction ----
  - platform: gpio
    id: usb_power
    name: Power adapter
    pin:
      number: GPIO4
      allow_other_uses: true # also the deep-sleep wake pin (ext0)
    device_class: plug
    on_press:
      - script.execute: apply_power_mode
    on_release:
      - script.execute: apply_power_mode

  - platform: gpio
    id: menu_button
    name: Button
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - component.update: epd

sensor:
  - platform: scd4x
    i2c_id: bus_a
    id: scd
    measurement_mode: periodic
    update_interval: ${sensor_interval}
    altitude_compensation: 50m
    # No chip-side offset. The stock firmware switches it on the chip per
    # mode, which ESPHome cannot do at runtime, so the whole correction -
    # temperature AND the humidity that depends on it - happens in the
    # filters below. (A fixed 4.4 K here left RH far too low on the adapter.)
    temperature_offset: 0
    # OFF on purpose. ASC re-baselines on the lowest reading it has seen,
    # assuming the sensor meets fresh air regularly. This one lives in a room
    # that often goes >24 h without airing out, so ASC would corrupt the
    # baseline and overwrite the manual calibration. Recalibrate outdoors
    # with the "Calibrate to 420 ppm" button every few months instead.
    automatic_self_calibration: false
    co2:
      name: CO2
      id: co2
    temperature:
      name: Temperature
      id: temp
      filters:
        # Self-heating compensation, per power mode (see substitutions).
        - lambda: |-
            float off;
            if (!id(usb_power).state)               off = id(temp_offset_battery).state;
            else if (id(wifi_comp).is_connected())  off = id(temp_offset_wifi).state;
            else                                    off = id(temp_offset_usb).state;
            return x - off;
    humidity:
      name: Humidity
      id: rh
      filters:
        # The SCD4x reports RH relative to its own (warm) temperature. Same
        # absolute humidity at the corrected temperature means a higher RH:
        #   RH = RH_raw * e_s(T_raw) / e_s(T)   (Magnus, Sensirion constants)
        # Temperature is published before humidity, so both are current.
        - lambda: |-
            float t_raw = id(temp).get_raw_state();
            float t = id(temp).state;
            if (std::isnan(t_raw) || std::isnan(t)) return x;
            auto es = [](float c) { return std::exp(17.62f * c / (243.12f + c)); };
            return std::min(100.0f, std::max(0.0f, x * es(t_raw) / es(t)));
      # Humidity is published last, so the whole set is fresh here.
      on_value:
        - if:
            condition:
              binary_sensor.is_off: usb_power
            then:
              # Battery: draw once and sleep straight away.
              - component.update: epd
              # The display driver blocks until the refresh is done, so
              # only a short grace period is needed here.
              - delay: 200ms
              - deep_sleep.enter: sleeper

  - platform: adc
    id: batt_v
    pin: GPIO5
    name: Battery voltage
    attenuation: 12db
    samples: 4
    update_interval: 60s
    unit_of_measurement: V
    accuracy_decimals: 2
    entity_category: diagnostic
    filters:
      - multiply: 2.0 # 1:2 divider on the board
    on_value:
      # Derive the percentage from every new reading instead of on its own
      # timer, so it is never behind the voltage.
      - component.update: batt_pct
      # Charge limit, same hysteresis as the stock updateCharging(): it has
      # to read above 4.0 V a few times in a row before charging stops.
      - lambda: |-
          static int high_count = 0;
          if (!id(usb_power).state || !id(charge_limit).state) {
            high_count = 0;
            return;
          }
          if (x > 4.0f) {
            if (++high_count >= 3) id(disable_charging).turn_on();
          } else if (x < 3.9f) {
            high_count = 0;
            id(disable_charging).turn_off();
          }
    on_value_range:
      - below: ${low_battery_volts}
        then:
          - lambda: id(low_battery) = true;
          - component.update: epd
          - delay: 5s
          - if:
              condition:
                binary_sensor.is_off: usb_power
              then:
                # Park for 12 h. Plugging in the adapter wakes it immediately.
                - deep_sleep.enter:
                    id: sleeper
                    sleep_duration: 12h

  - platform: template
    id: batt_pct
    name: Battery
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: never # recomputed on every batt_v reading
    lambda: |-
      float v = id(batt_v).state;
      if (std::isnan(v)) return {};
      if (v <= 3.30f) return 0.0f;
      if (v >= 4.15f) return 100.0f;
      // Coarse LiPo curve: 3.30-3.70 V covers the bottom half.
      if (v < 3.70f) return (v - 3.30f) / 0.40f * 50.0f;
      return 50.0f + (v - 3.70f) / 0.45f * 50.0f;

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_addr
      internal: true

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: Status LED
    pin: GPIO39
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

interval:
  # The panel is only redrawn this often on the adapter; on battery the sensor
  # draws once per wake instead (see the humidity on_value above).
  # ESPHome fires an interval's first run at a random point in the first half
  # of the interval, i.e. often before the first CO2 reading after a wake -
  # so skip until there is a value, or it would draw "---" over the last one.
  - interval: ${display_interval}
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: usb_power
              - lambda: return id(co2).has_state();
          then:
            - component.update: epd

  # On the adapter without a connection: give Wi-Fi another short chance.
  # Also catches a connection that dropped while the device was running.
  - interval: ${wifi_retry}
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: usb_power
              - not:
                  wifi.connected:
          then:
            - wifi.enable:
            - script.execute: wifi_give_up

  # Traffic-light colour, adapter only - the LED is the biggest battery drain.
  - interval: 15s
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: usb_power
              - switch.is_on: led_enabled
              - lambda: return id(co2).has_state();
          then:
            - script.execute: update_led

script:
  - id: apply_power_mode
    mode: restart
    then:
      # Measure the battery on every boot and every plug/unplug, before
      # anything is drawn. The ADC read is synchronous and batt_pct is derived
      # from it in batt_v's on_value, so both are current when the display
      # draws (the 60 s poll alone would first run up to 30 s after boot).
      - component.update: batt_v
      - if:
          condition:
            binary_sensor.is_on: usb_power
          then:
            - deep_sleep.prevent: sleeper
            - wifi.enable:
            - script.execute: wifi_give_up
            - if:
                condition:
                  switch.is_on: led_enabled
                then:
                  - switch.turn_on: led_power
            # Show "USB" right away instead of at the next 30 s tick. After a
            # wake from deep sleep the first CO2 reading takes ~6 s, so wait
            # for it rather than drawing "---".
            - wait_until:
                condition:
                  lambda: return id(co2).has_state();
                timeout: 15s
            - component.update: epd
          else:
            - light.turn_off: led
            - delay: 50ms
            - switch.turn_off: led_power
            - wifi.disable:
            - deep_sleep.allow: sleeper

  # Switch the radio off again if no network shows up (e.g. at the office).
  - id: wifi_give_up
    mode: restart
    then:
      - delay: ${wifi_give_up}
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - logger.log:
                level: INFO
                format: "No Wi-Fi found, radio off until the next retry"
            - wifi.disable:

  - id: update_led
    then:
      - switch.turn_on: led_power
      - lambda: |-
          // Colour ramp copied from the stock firmware.
          int ppm = (int) id(co2).state;
          int red = 0, green = 0, blue = 0;
          if (ppm > 2000) {
            red = 216; green = 2; blue = 131;          // magenta
          } else {
            red   = (int) (std::pow(ppm - 400, 2) / 10000.0);
            green = (int) (-std::pow(ppm - 400, 2) / 4500.0 + 255.0);
            red   = std::max(0, std::min(255, red));
            green = std::max(0, std::min(255, green));
          }
          auto call = id(led).turn_on();
          call.set_rgb(red / 255.0f, green / 255.0f, blue / 255.0f);
          call.set_brightness(0.15f);   // stock default is dim
          call.set_transition_length(0);
          call.perform();

number:
  # Tune these against a reference thermometer placed next to the sensor,
  # after the device has been in that mode for at least an hour (it takes a
  # while to warm up on the adapter and to cool down after unplugging).
  # If it reads 1.5 K too high, raise the offset for that mode by 1.5.
  - platform: template
    id: temp_offset_wifi
    name: Temperature offset adapter Wi-Fi
    unit_of_measurement: K
    entity_category: config
    mode: box
    min_value: -5
    max_value: 25
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: ${temp_offset_wifi}

  - platform: template
    id: temp_offset_usb
    name: Temperature offset adapter no Wi-Fi
    unit_of_measurement: K
    entity_category: config
    mode: box
    min_value: -5
    max_value: 25
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: ${temp_offset_usb}

  - platform: template
    id: temp_offset_battery
    name: Temperature offset battery
    unit_of_measurement: K
    entity_category: config
    mode: box
    min_value: -5
    max_value: 25
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: ${temp_offset_battery}

button:
  - platform: template
    name: Display full refresh
    entity_category: config
    on_press:
      - lambda: id(epd).request_full_update();
      - component.update: epd

  - platform: template
    name: Calibrate to 420 ppm
    entity_category: config
    on_press:
      # Only run this outdoors, after 3+ minutes of fresh air.
      - scd4x.perform_forced_calibration:
          id: scd
          value: 420

font:
  - file: fonts/DejaVuSansCondensed-Bold.ttf
    id: font_big
    size: 76
    glyphs: "0123456789-"
  - file: fonts/DejaVuSansCondensed-Bold.ttf
    id: font_med
    size: 26
    glyphs: "GUTOKMÄSILÜFEN"
  - file: fonts/DejaVuSansCondensed-Bold.ttf
    id: font_label
    size: 20
    glyphs: "0123456789 %rHpm"
  - file: fonts/DejaVuSansCondensed.ttf
    id: font_small
    size: 14
    glyphs: "0123456789.% USBATERYMPVNOWIF-"

display:
  # 1.54" 200x200 SSD1681. ESPHome's waveshare_epaper (model 1.54inv2) resets
  # the panel before every refresh and then only writes the new image, so the
  # controller has no "previous" image to diff against and partial refreshes
  # leave the old content behind. This driver keeps the last image in RTC
  # memory (survives deep sleep) and writes it back first, like the stock
  # firmware's writePrevImage(). Init and waveforms are the stock firmware's.
  - platform: openco2_epaper
    id: epd
    spi_id: disp_spi
    cs_pin: GPIO42
    dc_pin: GPIO8
    busy_pin: GPIO6
    reset_pin: GPIO7
    rotation: 270°
    update_interval: never # updated from the sensor automation
    full_update_interval: ${full_update_interval}
    # Layout (200x200): status bar | CO2 value + ppm | CO2 scale | rating + RH.
    # No temperature: the SCD4x sits on the warm PCB and the reading cannot be
    # compensated well enough to be useful (the HA entity is kept for RH).
    lambda: |-
      const int W = 200, M = 4;  // width, common side margin
      float co2v = id(co2).has_state() ? id(co2).state : NAN;

      // ---- status bar ----
      if (id(low_battery)) {
        it.printf(W / 2, 0, id(font_small), TextAlign::TOP_CENTER, "BATTERY EMPTY");
      } else {
        // Always measured before the first draw (apply_power_mode, on boot and
        // on every plug/unplug), so this is a real reading.
        float pct = id(batt_pct).state;
        // battery icon: 20x10 body + nub, filled by charge level
        it.rectangle(M, 3, 20, 10);
        it.filled_rectangle(M + 20, 6, 2, 4);
        it.filled_rectangle(M + 2, 5, (int) roundf(16.0f * pct / 100.0f), 6);
        const bool usb = id(usb_power).state;
        it.printf(M + 26, 0, id(font_small), TextAlign::TOP_LEFT, "%.0f%% %s", pct, usb ? "USB" : "BAT");
        if (usb)
          it.printf(W - M, 0, id(font_small), TextAlign::TOP_RIGHT, "%s",
                    id(wifi_comp).is_connected() ? id(ip_addr).state.c_str() : "NO WI-FI");
        else if (id(batt_v).has_state())
          it.printf(W - M, 0, id(font_small), TextAlign::TOP_RIGHT, "%.2fV", id(batt_v).state);
      }
      it.horizontal_line(0, 18, W);

      // ---- CO2 value ----
      if (std::isnan(co2v))
        it.printf(W / 2, 24, id(font_big), TextAlign::TOP_CENTER, "---");
      else
        it.printf(W / 2, 24, id(font_big), TextAlign::TOP_CENTER, "%.0f", co2v);
      it.printf(W / 2, 100, id(font_label), TextAlign::TOP_CENTER, "ppm");

      // ---- CO2 scale 400..2000 ppm, ticks at the rating thresholds ----
      const int bx = M, by = 134, bw = W - 2 * M, bh = 12;
      auto to_x = [&](float ppm) {
        float f = (ppm - 400.0f) / 1600.0f;
        f = f < 0.0f ? 0.0f : (f > 1.0f ? 1.0f : f);
        return bx + (int) roundf(f * (bw - 1));
      };
      it.rectangle(bx, by, bw, bh);
      if (!std::isnan(co2v))
        it.filled_rectangle(bx, by, to_x(co2v) - bx + 1, bh);
      for (float t : {800.0f, 1000.0f, 1400.0f}) {
        int tx = to_x(t);
        bool inside = !std::isnan(co2v) && co2v >= t;
        it.vertical_line(tx, by - 3, 3);
        it.vertical_line(tx, by + bh, 3);
        it.vertical_line(tx, by + 2, bh - 4, inside ? COLOR_OFF : COLOR_ON);
      }

      // ---- rating | humidity, on one baseline ----
      const int base = 191;
      if (!std::isnan(co2v)) {
        const char *rating = co2v < 800 ? "GUT" : co2v < 1000 ? "OK" : co2v < 1400 ? "MÄSSIG" : "LÜFTEN";
        if (co2v >= 1400) {
          // the one state that needs action: white on black, flush with the edge
          const int pad = 6;
          int x1, y1, tw, th;
          it.get_text_bounds(pad, base, rating, id(font_med), TextAlign::BASELINE_LEFT, &x1, &y1, &tw, &th);
          it.filled_rectangle(0, base - 26, x1 + tw + pad, 33);
          it.printf(pad, base, id(font_med), COLOR_OFF, TextAlign::BASELINE_LEFT, "%s", rating);
        } else {
          it.printf(M, base, id(font_med), TextAlign::BASELINE_LEFT, "%s", rating);
        }
      }
      if (id(rh).has_state())
        it.printf(W - M, base, id(font_label), TextAlign::BASELINE_RIGHT, "%.0f %%rH", id(rh).state);
